---

- name: "Verify Operating System Support"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in webserver_platform
    fail_msg: >-
      Web server installation is not defined for
      {{ ansible_facts.os_family }}.

- name: Install and Configure Apache
  become: true
  block:
    - name: Install Apache
      ansible.builtin.package:
        name: "{{ webserver_platform[ansible_facts.os_family].package }}"
        state: present
      notify: Apply web configuration
    - name: Create/Update Apache Web Page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Apply web configuration
    - name: Allow HTTP through firewalld
      ansible.posix.firewalld:
        zone: "{{ webserver_firewalld_zone }}"
        service: http
        state: enabled
        permanent: true
        immediate: true
      when: ansible_facts.os_family == "RedHat"
    - name: Enable and Start Apache
      ansible.builtin.service:
        name: "{{ webserver_platform[ansible_facts.os_family].service }}"
        state: started
        enabled: true



- name: Deploy Application Configuration File
  become: true

  block:
  - name: Create application configuration directory
    ansible.builtin.file:
      path: /etc/myapp
      state: directory
      owner: root
      group: root
      mode: "0750"
  - name: Install application configuration
    ansible.builtin.template:
      src: application.cfg.j2
      dest: /etc/myapp/application.cfg
      owner: root
      group: root
      mode: "0600"
    diff: false